spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:perfumeshop-api}
    username: ${DB_USER:perfume-api}
    password: ${DB_PASSWORD:perfume-api}

  jpa:
    hibernate:
      ddl-auto: validate # Flyway es dueño del esquema, Hibernate solo se encarga de validar.
    properties:
      hibernate:
        format_sql: true
    show_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:345b737333ed80}
    password: ${MAIL_PASSWORD:SECRET}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true



springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-in-production}
  expiration: 86400000